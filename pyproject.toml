[project]
name = "ini-comment-preserver"
version = "0.1.0"
description = "Reads and writes INI files while preserving comments, key ordering, and inline whitespace lost by configparser."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
